name: 功能建议
description: 希望插件支持的新能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要这个功能？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 期望的指令 / 配置项 / 行为
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
    validations:
      required: false
